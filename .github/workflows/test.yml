name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build the iPhone app and widget
        run: xcodebuild -project iOS/PrintGlance.xcodeproj -target PrintGlance -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run feed tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s Tests/Feed -v
