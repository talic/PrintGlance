name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  app:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Info.plist
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version v$version" >&2
            exit 1
          fi
      - name: Run tests
        run: swift test
      - name: Build app
        run: make zip
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintGlance.zip
          generate_release_notes: false
