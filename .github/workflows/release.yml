name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run: everything a tag does, but the zip goes to the run's artifacts instead of a release.
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Info.plist
        if: github.event_name == 'push'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version v$version" >&2
            exit 1
          fi
      - name: Run tests
        run: swift test
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # ponytail: without the certificate, ship ad-hoc like 1.1.x. Once the secrets exist,
          # turn this back into an error so a lost secret can't quietly ship an unsigned release.
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::warning::No DEVELOPER_ID_P12_BASE64 / DEVELOPER_ID_P12_PASSWORD secrets. Building ad-hoc signed, not notarized."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::The certificate has no Developer ID Application identity." >&2
            exit 1
          fi
          echo "SIGN_ID=$identity" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -z "$SIGN_ID" ]; then
            make zip
            exit 0
          fi
          if [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ] || [ -z "$NOTARY_KEY_P8_BASE64" ]; then
            echo "::error::Add the NOTARY_KEY_ID, NOTARY_ISSUER_ID and NOTARY_KEY_P8_BASE64 secrets." >&2
            exit 1
          fi
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY"
          make notarize
      - name: Check Gatekeeper accepts the downloaded app
        if: env.SIGN_ID != ''
        run: |
          ditto -x -k dist/PrintGlance.zip "$RUNNER_TEMP/check"
          xcrun stapler validate "$RUNNER_TEMP/check/PrintGlance.app"
          spctl -a -vv "$RUNNER_TEMP/check/PrintGlance.app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"
      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintGlance.zip
          generate_release_notes: false
      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PrintGlance
          path: dist/PrintGlance.zip
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
