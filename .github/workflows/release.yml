name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  app:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make zip
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintGlance.zip
          generate_release_notes: true
